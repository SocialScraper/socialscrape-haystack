[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socialscrape-haystack"
version = "0.1.1"
description = "Haystack components and agent tools for SocialScrape: profiles, posts, comments, search and video transcripts from social platforms as Documents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "SocialScrape", email = "hello@socialscrape.dev" }]
keywords = ["haystack", "deepset", "components", "tools", "agents", "social media", "tiktok", "instagram", "youtube", "transcript", "rag"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = ["haystack-ai>=2.14", "socialscrape-sdk>=0.1.2,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://socialscrape.dev/?utm_source=pypi&utm_medium=package&utm_campaign=socialscrape-haystack"
Documentation = "https://socialscrape.dev/docs/haystack?utm_source=pypi&utm_medium=package&utm_campaign=socialscrape-haystack"
Repository = "https://github.com/SocialScraper/socialscrape-haystack"
Issues = "https://github.com/SocialScraper/socialscrape-haystack/issues"

[tool.hatch.build.targets.wheel]
packages = ["socialscrape_haystack"]

[tool.hatch.build.targets.sdist]
include = ["socialscrape_haystack", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
